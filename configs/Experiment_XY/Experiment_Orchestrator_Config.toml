[orchestrator]
max_parallel = 2                # how many experiments run at once
skip_existing = true            # skip runs that look finished
shuffle = true                  # randomize order
cap_mem_frac = 0.16             # per process CUDA memory cap. 0.0 to disable
stagger_start_seconds = 5.0     # small delay before each worker starts
defer_git_push = true           # push commits from parent only
filters = []                    # optional substr filters on cfg path or exp name

[experiments]
paths = [
    "configs/Experiment_XY/Experiment-XY-Run-1.toml"
]