[orchestrator]
max_parallel = 2                # how many experiments run at once
skip_existing = false            # skip runs that look finished
shuffle = false                  # randomize order
cap_mem_frac = 0.1             # per process CUDA memory cap. 0.0 to disable
stagger_start_seconds = 1.0     # small delay before each worker starts
defer_git_push = true           # push commits from parent only
filters = []                    # optional substr filters on cfg path or exp name

[experiments]
paths = [
    "configs/Experiment_3/Experiment-3-Run-1.toml",
