[project]
name = "DAC-Loop"
version = "0.1.0"
description = "DAC-Loop introduces a dynamic and model agnostic framework to compress the model size with a knowledge distillation and pruning."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.1.1",
    "matplotlib>=3.10.6",
    "notebook>=7.4.7",
    "numpy>=2.3.3",
    "pandas-stubs~=2.3.3",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.2",
    "torch>=2.8.0",
    "torch-pruning>=1.6.1",
    "torchinfo>=1.8.0",
    "torchvision>=0.23.0",
]
